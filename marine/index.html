<style>
:root{--bg:#F6F8FA;--ink:#0F1B2D;--mute:#5B6778;--line:#D9E0E8;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--ink:#eef2f6;--mute:#9aa8b8;--line:#253142;--card:#17202c}}
:root[data-theme="dark"]{--bg:#10161f;--ink:#eef2f6;--mute:#9aa8b8;--line:#253142;--card:#17202c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;word-break:keep-all}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1640px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:800}
.top h1 small{font-size:13px;color:var(--mute);font-weight:500;margin-left:8px}
.links{display:flex;gap:8px;font-size:13px;flex-wrap:wrap}
.links a{padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-weight:600}
.links a:hover{border-color:var(--ink)}
nav{max-width:1640px;margin:0 auto;padding:10px 16px 0;display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap;color:var(--mute)}
nav a b{font-weight:800;margin-right:6px}
nav a span{font-size:13px}
nav a.on{color:var(--ink);border-bottom-color:#0F766E}
main{max-width:1640px;margin:0 auto;padding:14px 8px 30px}
iframe{display:block;width:100%;border:0;background:#fff;border-radius:6px}
.hint{max-width:1640px;margin:0 auto;padding:0 16px 30px;font-size:12.5px;color:var(--mute)}

<body>

<p class="hint">AI·데이터 기반 해양·수산 서비스 개발자 과정 · 담당 4과목 145시간 · 숫자는 교안 실습의 실제 실행 결과입니다.</p>
<script>
const f=document.getElementById('f'),open=document.getElementById('open'),tabs=[...document.querySelectorAll('nav a')];
function size(){try{const d=f.contentDocument;if(!d||!d.body)return;f.style.height=Math.ceil(d.documentElement.getBoundingClientRect().height||d.body.scrollHeight)+'px'}catch(e){}}
function go(){const k=(location.hash||'#u1').slice(1);const t=tabs.find(a=>a.dataset.k===k)||tabs[0];tabs.forEach(a=>a.classList.toggle('on',a===t));const src=t.dataset.k+'.html';if(!f.src.endsWith(src))f.src=src;open.href=src}
f.addEventListener('load',()=>{size();setTimeout(size,300);setTimeout(size,1200);try{f.contentWindow.addEventListener('resize',()=>setTimeout(size,50))}catch(e){}});
addEventListener('resize',()=>setTimeout(size,80));addEventListener('hashchange',go);go();
</script>
</body>
